<head>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #f8f5f0;
      color: #2a2a2a;
      line-height: 1.7;
      padding: 60px 20px;
    }

    main {
      max-width: 780px;
      margin: auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 80px;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: #1f1f1f;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1.05rem;
      color: #5e5e5e;
      letter-spacing: 0.5px;
    }

    /* Sections */
    section {
      margin-bottom: 60px;
    }

    section h2 {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #2c2c2c;
      border-left: 3px solid #201d1c;
      padding-left: 12px;
      letter-spacing: 0.5px;
    }

   
    ul {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    li {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    li:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    }

    a {
      color: #5c2500;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a:hover {
      color: #7c5a3a;
      text-decoration: underline;
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #8a8a8a;
      margin-top: 80px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
